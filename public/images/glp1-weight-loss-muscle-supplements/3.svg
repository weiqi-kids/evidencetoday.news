<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">選購前，先確認這四件事</title>
  <desc id="desc">檢查清單列出產品成分與劑量、人體研究、適用族群、腎臟狀況及用藥核對項目。</desc>
  <style>
    text { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: #1A4F8B; }
    .sub { font-size: 16px; fill: #64748B; }
    .head { font-size: 18px; font-weight: 700; fill: #1A4F8B; }
    .question { font-size: 19px; font-weight: 600; fill: #1E293B; }
    .note { font-size: 15px; fill: #64748B; }
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text class="title" x="56" y="58">選購前，先確認這四件事</text>
  <text class="sub" x="56" y="88">逐項檢視資訊；有疑問時，帶著產品標示詢問專業人員。</text>

  <rect x="56" y="116" width="410" height="174" rx="14" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <circle cx="88" cy="151" r="17" fill="#1A4F8B"/>
  <text x="88" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text class="head" x="118" y="157">成分與劑量</text>
  <rect x="82" y="184" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="2"/>
  <text class="question" x="116" y="201">產品含哪些成分？</text>
  <text class="question" x="116" y="232">每份劑量是多少？</text>

  <rect x="494" y="116" width="410" height="174" rx="14" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <circle cx="526" cy="151" r="17" fill="#1A4F8B"/>
  <text x="526" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <text class="head" x="556" y="157">人體研究</text>
  <rect x="520" y="184" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="2"/>
  <text class="question" x="554" y="201">有人體研究嗎？</text>
  <text class="question" x="554" y="232">研究測量了什麼結果？</text>

  <rect x="56" y="310" width="410" height="174" rx="14" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <circle cx="88" cy="345" r="17" fill="#1A4F8B"/>
  <text x="88" y="351" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
  <text class="head" x="118" y="351">適用族群</text>
  <rect x="82" y="378" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="2"/>
  <text class="question" x="116" y="395">研究對象的年齡與健康狀況，</text>
  <text class="question" x="116" y="426">和你相符嗎？</text>

  <rect x="494" y="310" width="410" height="174" rx="14" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <circle cx="526" cy="345" r="17" fill="#1A4F8B"/>
  <text x="526" y="351" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
  <text class="head" x="556" y="351">腎臟與用藥</text>
  <rect x="520" y="378" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="2"/>
  <text class="question" x="554" y="395">腎臟狀況與目前用藥，</text>
  <text class="question" x="554" y="426">已和醫師或藥師確認嗎？</text>

  <text class="note" x="56" y="536">看懂差異：</text>
  <rect x="144" y="515" width="118" height="34" rx="17" fill="#FFF3E5" stroke="#E8923A"/>
  <text x="203" y="537" text-anchor="middle" font-size="15" font-weight="700" fill="#8A4B0F">行銷說法</text>
  <text class="note" x="273" y="537">與</text>
  <rect x="301" y="515" width="118" height="34" rx="17" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="2"/>
  <text x="360" y="537" text-anchor="middle" font-size="15" font-weight="700" fill="#1A4F8B">研究證據</text>
  <text class="note" x="435" y="537">分開看，別把宣稱當成研究結果。</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#64748B" fill-opacity="0.45" font-weight="600">本日有據</text></svg>