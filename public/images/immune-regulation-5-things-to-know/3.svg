<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <style>
      .ttl{font:bold 20px sans-serif;fill:#fff;text-anchor:middle}
      .sub{font:12px sans-serif;fill:#64748B;text-anchor:middle}
      .cl{font:bold 13px sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .cs{font:11px sans-serif;fill:#cce0f5;text-anchor:middle;dominant-baseline:middle}
      .sn{font:bold 46px sans-serif;fill:#E8923A;text-anchor:middle}
      .st{font:14px sans-serif;fill:#fff;text-anchor:middle}
      .sb{font:12px sans-serif;fill:#cce0f5;text-anchor:middle}
      .pt{font:12px sans-serif;fill:#EEF4FB}
      .src{font:11px sans-serif;fill:#64748B;text-anchor:middle}
    </style>
  </defs>

  <rect width="960" height="600" fill="#fff"/>
  <rect x="0" y="0" width="960" height="56" fill="#1A4F8B"/>
  <text x="480" y="35" class="ttl">維生素 D 受體（VDR）與免疫細胞的關聯</text>

  <rect x="16" y="68" width="596" height="514" rx="12" fill="#EEF4FB"/>

  <!-- dotted lines VDR→cells -->
  <line x1="314" y1="263" x2="314" y2="178" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="353" y1="281" x2="452" y2="222" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="366" y1="318" x2="494" y2="338" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="350" y1="356" x2="432" y2="430" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="278" y1="356" x2="196" y2="430" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="262" y1="318" x2="140" y2="320" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- VDR center -->
  <circle cx="314" cy="318" r="52" fill="#1A4F8B" stroke="#E8923A" stroke-width="3"/>
  <text x="314" y="311" class="cl" style="font-size:15px">VDR</text>
  <text x="314" y="330" style="font:11px sans-serif;fill:#cce0f5;text-anchor:middle">維生素D受體</text>

  <!-- B細胞 top -->
  <circle cx="314" cy="136" r="40" fill="#3E7CB1"/>
  <text x="314" y="130" class="cl">B 細胞</text>
  <text x="314" y="148" class="cs">抗體產生</text>

  <!-- T細胞 top-right -->
  <circle cx="494" cy="196" r="40" fill="#3E7CB1"/>
  <text x="494" y="190" class="cl">T 細胞</text>
  <text x="494" y="208" class="cs">細胞免疫</text>

  <!-- NK細胞 right -->
  <circle cx="536" cy="338" r="40" fill="#3E7CB1"/>
  <text x="536" y="332" class="cl">NK 細胞</text>
  <text x="536" y="350" class="cs">自然殺手</text>

  <!-- 巨噬細胞 bottom-right -->
  <circle cx="472" cy="468" r="40" fill="#3E7CB1"/>
  <text x="472" y="462" class="cl">巨噬細胞</text>
  <text x="472" y="480" class="cs">吞噬病原</text>

  <!-- 嗜中性球 bottom-left -->
  <circle cx="156" cy="468" r="40" fill="#3E7CB1"/>
  <text x="156" y="462" class="cl">嗜中性球</text>
  <text x="156" y="480" class="cs">第一防線</text>

  <!-- 樹突細胞 left -->
  <circle cx="98" cy="320" r="40" fill="#3E7CB1"/>
  <text x="98" y="314" class="cl">樹突細胞</text>
  <text x="98" y="332" class="cs">抗原呈遞</text>

  <!-- legend line -->
  <line x1="228" y1="560" x2="268" y2="560" stroke="#E8923A" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="278" y="564" class="sub" style="text-anchor:start">VDR 結合路徑</text>

  <!-- Stat box -->
  <rect x="628" y="68" width="316" height="514" rx="12" fill="#1A4F8B"/>
  <text x="786" y="118" class="st" style="font-size:16px;font-weight:bold">台灣數據</text>
  <line x1="660" y1="132" x2="912" y2="132" stroke="#3E7CB1" stroke-width="1"/>
  <text x="786" y="210" class="sn">44.6%</text>
  <text x="786" y="248" class="st" style="fill:#E8923A">育齡女性（20–49 歲）</text>
  <text x="786" y="274" class="sb">維生素 D 不足</text>
  <line x1="660" y1="300" x2="912" y2="300" stroke="#3E7CB1" stroke-width="1"/>
  <circle cx="652" cy="332" r="5" fill="#E8923A"/>
  <text x="666" y="337" class="pt">VDR 廣泛存在六類免疫細胞</text>
  <circle cx="652" cy="368" r="5" fill="#E8923A"/>
  <text x="666" y="373" class="pt">免疫調節需要足量維生素 D</text>
  <circle cx="652" cy="404" r="5" fill="#E8923A"/>
  <text x="666" y="409" class="pt">日曬與飲食是主要補充途徑</text>
  <circle cx="652" cy="440" r="5" fill="#E8923A"/>
  <text x="666" y="445" class="pt">補充前請諮詢醫師或營養師</text>
  <line x1="660" y1="472" x2="912" y2="472" stroke="#3E7CB1" stroke-width="1"/>
  <text x="786" y="510" class="src" style="fill:#64748B">資料來源：</text>
  <text x="786" y="528" class="src" style="fill:#64748B">台灣國民營養健康狀況變遷調查</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#64748B" fill-opacity="0.45" font-weight="600">本日有據</text></svg>