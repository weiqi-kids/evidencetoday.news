    .label { font-size: 18px; font-weight: 700; fill: #1A4F8B; }
    .hint { font-size: 15px; fill: #64748B; }
    .cell { fill: #FFFFFF; stroke: #3E7CB1; stroke-width: 1.5; }
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text id="title-text" class="title" x="48" y="62">人體研究是否適用於這項產品？</text>
