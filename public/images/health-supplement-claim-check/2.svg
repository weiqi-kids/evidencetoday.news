<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">人體研究與保健食品標示比對</title>
  <desc id="desc">並列核對成分、劑量、研究對象及使用時間。</desc>
  <style>
    text { font-family: sans-serif; fill: #1E293B; }
