<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">複方礦物質小腸吸收競爭示意圖</title>
  <desc id="desc">複方礦物質膠囊中鈣鎂鋅鐵在小腸競爭有限吸收通道的示意圖</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#1E293B}
    .title{font-size:30px;font-weight:700;fill:#1A4F8B}
    .label{font-size:20px;font-weight:700}
    .small{font-size:16px;fill:#64748B}
    .mineral{font-size:22px;font-weight:700}
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="52" text-anchor="middle" class="title">複方礦物質｜小腸吸收競爭示意</text>
  <rect x="55" y="92" width="850" height="150" rx="24" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="3"/>
  <rect x="105" y="122" width="260" height="90" rx="45" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="3"/>
  <path d="M235 122h85a45 45 0 0 1 0 90h-85z" fill="#3E7CB1"/>
  <line x1="235" y1="122" x2="235" y2="212" stroke="#1A4F8B" stroke-width="3"/>
  <text x="235" y="176" text-anchor="middle" class="label">複方礦物質</text>
  <circle cx="465" cy="137" r="25" fill="#E8923A"/><text x="465" y="145" text-anchor="middle" class="mineral" fill="#FFFFFF">鈣</text>
  <circle cx="570" cy="137" r="25" fill="#3E7CB1"/><text x="570" y="145" text-anchor="middle" class="mineral" fill="#FFFFFF">鎂</text>
  <circle cx="675" cy="137" r="25" fill="#1A4F8B"/><text x="675" y="145" text-anchor="middle" class="mineral" fill="#FFFFFF">鋅</text>
  <circle cx="780" cy="137" r="25" fill="#64748B"/><text x="780" y="145" text-anchor="middle" class="mineral" fill="#FFFFFF">鐵</text>
  <text x="465" y="193" class="small">多種礦物質同時進入小腸</text>
  <rect x="55" y="275" width="850" height="245" rx="24" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="3"/>
  <text x="480" y="310" text-anchor="middle" class="label" fill="#1A4F8B">競爭相同的吸收通道</text>
  <line x1="465" y1="162" x2="255" y2="390" stroke="#E8923A" stroke-width="5"/>
  <path d="M255 390l-12-25m12 25l25-5" fill="none" stroke="#E8923A" stroke-width="5"/>
  <line x1="570" y1="162" x2="420" y2="390" stroke="#3E7CB1" stroke-width="5"/>
  <path d="M420 390l-10-26m10 26l24-10" fill="none" stroke="#3E7CB1" stroke-width="5"/>
  <line x1="675" y1="162" x2="585" y2="390" stroke="#1A4F8B" stroke-width="5"/>
  <path d="M585 390l-2-28m2 28l22-17" fill="none" stroke="#1A4F8B" stroke-width="5"/>
  <line x1="780" y1="162" x2="750" y2="390" stroke="#64748B" stroke-width="5"/>
  <path d="M750 390l-10-26m10 26l18-20" fill="none" stroke="#64748B" stroke-width="5"/>
  <rect x="180" y="405" width="560" height="78" rx="18" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="3"/>
  <rect x="225" y="423" width="82" height="42" rx="10" fill="#FFFFFF" stroke="#E8923A" stroke-width="4"/>
  <rect x="337" y="423" width="82" height="42" rx="10" fill="#FFFFFF" stroke="#E8923A" stroke-width="4"/>
  <rect x="449" y="423" width="82" height="42" rx="10" fill="#FFFFFF" stroke="#E8923A" stroke-width="4"/>
  <rect x="561" y="423" width="82" height="42" rx="10" fill="#FFFFFF" stroke="#E8923A" stroke-width="4"/>
  <text x="700" y="450" text-anchor="end" class="small">有限通道</text>
  <text x="480" y="558" text-anchor="middle" class="small">示意圖：實際吸收情形會受多種因素影響</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#64748B" fill-opacity="0.45" font-weight="600">本日有據</text></svg>