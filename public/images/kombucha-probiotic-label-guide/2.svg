<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">康普茶標示欄位</title>
  <desc id="desc">康普茶標示上的份量、每份糖量、茶來源、配料與活菌資訊欄位。</desc>
  <style>
    text { font-family: sans-serif; }
    .title { fill: #1A4F8B; font-size: 34px; font-weight: 700; }
    .subtitle { fill: #64748B; font-size: 17px; }
    .heading { fill: #1E293B; font-size: 20px; font-weight: 700; }
    .note { fill: #64748B; font-size: 15px; }
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text id="title" x="48" y="75" class="title">康普茶標示，五項並列檢視</text>
