  <text x="362" y="402" class="hint">確認如何使用，以及建議使用時機</text>
  <rect x="286" y="442" width="626" height="88" rx="14" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <circle cx="326" cy="486" r="18" fill="#FFFFFF" stroke="#E8923A" stroke-width="2"/>
  <path d="M317 486l6 6 12-14" fill="none" stroke="#E8923A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
