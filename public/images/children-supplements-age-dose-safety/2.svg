  <rect x="494" y="124" width="213" height="424" rx="16" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <rect x="725" y="124" width="213" height="424" rx="16" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>

  <rect x="92" y="160" width="92" height="112" rx="8" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="3"/>
