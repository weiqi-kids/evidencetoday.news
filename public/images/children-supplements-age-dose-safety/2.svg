  <line x1="108" y1="223" x2="168" y2="223" stroke="#3E7CB1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="116" cy="247" r="5" fill="#E8923A"/>
  <circle cx="133" cy="247" r="5" fill="#E8923A"/>
  <circle cx="150" cy="247" r="5" fill="#E8923A"/>
