    .body { fill: #64748B; font-size: 16px; }
    .stroke { fill: none; stroke: #1A4F8B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text class="heading" x="40" y="76">兒童營養補充品｜標示檢核</text>

