  <circle class="accent" cx="834" cy="231" r="7"/>
  <text class="name" x="834" y="302" text-anchor="middle">魚油</text>
  <text class="label" x="834" y="362" text-anchor="middle">EPA 含量多少？</text>
  <text class="label" x="834" y="402" text-anchor="middle">DHA 含量多少？</text>
