<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">保健成分比較：可以先看什麼？</title>
  <desc id="desc">四欄並列呈現益生菌的菌株與研究對象、薑黃素的配方與吸收、維生素 D 的個人需要，以及魚油的 EPA 與 DHA 含量。</desc>
  <style>
    text { font-family: sans-serif; }
    .title { fill: #1A4F8B; font-size: 32px; font-weight: 700; }
