<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="手機畫面列出餐食時間、食物飲料、症狀發作、排便變化、睡眠與用藥紀錄欄位">
