<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">補充品檢驗報告能說明什麼</title>
  <desc id="desc">資訊圖分成兩欄，一欄列出檢驗報告涵蓋的樣品、項目、方法與結果，另一欄列出報告不能單獨證明的其他批次、產品功效與個人適用性。</desc>
  <style>
    text { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { fill: #1A4F8B; font-size: 30px; font-weight: 700; }
    .head { fill: #FFFFFF; font-size: 21px; font-weight: 700; }
    .item { fill: #1E293B; font-size: 19px; font-weight: 500; }
    .icon { fill: none; stroke-width: 2.5; }
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text class="title" x="480" y="62" text-anchor="middle">補充品檢驗報告的範圍與限制</text>

  <rect x="40" y="100" width="426" height="450" rx="18" fill="#EEF4FB" stroke="#1A4F8B" stroke-width="2"/>
  <path d="M58 100h390a18 18 0 0 1 18 18v54H40v-54a18 18 0 0 1 18-18z" fill="#1A4F8B"/>
  <text class="head" x="253" y="143" text-anchor="middle">檢驗報告能說明</text>

  <circle cx="82" cy="220" r="13" class="icon" stroke="#3E7CB1"/><circle cx="82" cy="220" r="4" fill="#E8923A"/>
  <text class="item" x="112" y="227">受檢樣品</text>
  <circle cx="82" cy="298" r="13" class="icon" stroke="#3E7CB1"/><circle cx="82" cy="298" r="4" fill="#E8923A"/>
  <text class="item" x="112" y="305">列出的檢驗項目</text>
  <circle cx="82" cy="376" r="13" class="icon" stroke="#3E7CB1"/><circle cx="82" cy="376" r="4" fill="#E8923A"/>
  <text class="item" x="112" y="383">檢驗方法</text>
  <circle cx="82" cy="454" r="13" class="icon" stroke="#3E7CB1"/><circle cx="82" cy="454" r="4" fill="#E8923A"/>
  <text class="item" x="112" y="461">報告結果</text>

  <rect x="494" y="100" width="426" height="450" rx="18" fill="#EEF4FB" stroke="#3E7CB1" stroke-width="2"/>
  <path d="M512 100h390a18 18 0 0 1 18 18v54H494v-54a18 18 0 0 1 18-18z" fill="#3E7CB1"/>
  <text class="head" x="707" y="143" text-anchor="middle">報告無法單獨證明</text>

  <circle cx="536" cy="220" r="13" class="icon" stroke="#3E7CB1"/><line x1="530" y1="226" x2="542" y2="214" stroke="#E8923A" stroke-width="2.5"/>
  <text class="item" x="566" y="227">每種成分或每個批次的結果</text>
  <circle cx="536" cy="318" r="13" class="icon" stroke="#3E7CB1"/><line x1="530" y1="324" x2="542" y2="312" stroke="#E8923A" stroke-width="2.5"/>
  <text class="item" x="566" y="325">產品是否有效</text>
  <circle cx="536" cy="416" r="13" class="icon" stroke="#3E7CB1"/><line x1="530" y1="422" x2="542" y2="410" stroke="#E8923A" stroke-width="2.5"/>
  <text class="item" x="566" y="423">是否適合每個人</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#64748B" fill-opacity="0.45" font-weight="600">本日有據</text></svg>