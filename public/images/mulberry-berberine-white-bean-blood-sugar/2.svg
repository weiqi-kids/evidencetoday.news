<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <title>桑葉萃取 DNJ 作用機制示意圖</title>
  <desc>桑葉萃取 DNJ 抑制 alpha-葡萄糖苷酶，延緩澱粉吸收；對精製糖無效的流程圖。</desc>
  <style>
    text{font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#1E293B}
    .title{font-size:30px;font-weight:700;fill:#1A4F8B}
    .label{font-size:19px;font-weight:700}
    .small{font-size:16px;fill:#64748B}
    .box{fill:#EEF4FB;stroke:#1A4F8B;stroke-width:3}
    .accent{fill:#FFF3E6;stroke:#E8923A;stroke-width:3}
    .arrow{stroke:#3E7CB1;stroke-width:4;fill:none}
    .bad{stroke:#C94343;stroke-width:6;stroke-linecap:round}
  </style>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="62" text-anchor="middle" class="title">桑葉萃取 DNJ 作用機制</text>
  <text x="480" y="94" text-anchor="middle" class="small">抑制 alpha-葡萄糖苷酶，延緩澱粉吸收（示意）</text>

  <rect x="35" y="190" width="185" height="125" rx="16" class="box"/>
  <text x="127" y="235" text-anchor="middle" class="label">澱粉</text>
  <text x="127" y="269" text-anchor="middle" class="small">飯／麵／麵包</text>

  <line x1="220" y1="252" x2="246" y2="252" class="arrow"/>
  <path d="M246 252l-12-8v16z" fill="#3E7CB1"/>

  <rect x="250" y="190" width="185" height="125" rx="16" class="accent"/>
  <text x="342" y="228" text-anchor="middle" class="label">alpha-</text>
  <text x="342" y="255" text-anchor="middle" class="label">葡萄糖苷酶</text>
  <text x="342" y="287" text-anchor="middle" class="small">被 DNJ 抑制</text>

  <line x1="435" y1="252" x2="461" y2="252" class="arrow"/>
  <path d="M461 252l-12-8v16z" fill="#3E7CB1"/>

  <rect x="465" y="190" width="185" height="125" rx="16" class="box"/>
  <text x="557" y="238" text-anchor="middle" class="label">葡萄糖吸收</text>
  <text x="557" y="271" text-anchor="middle" class="label">速度放慢</text>

  <line x1="650" y1="252" x2="676" y2="252" class="arrow"/>
  <path d="M676 252l-12-8v16z" fill="#3E7CB1"/>

  <rect x="680" y="190" width="245" height="125" rx="16" class="accent"/>
  <text x="802" y="238" text-anchor="middle" class="label">餐後血糖</text>
  <text x="802" y="271" text-anchor="middle" class="label">峰值較低</text>

  <text x="480" y="385" text-anchor="middle" class="small">另一條平行路徑</text>
  <line x1="127" y1="315" x2="127" y2="445" class="arrow"/>
  <path d="M127 445l-8-12h16z" fill="#3E7CB1"/>

  <rect x="250" y="420" width="330" height="105" rx="16" class="box"/>
  <text x="415" y="463" text-anchor="middle" class="label">精製糖／砂糖／果糖</text>
  <text x="415" y="495" text-anchor="middle" class="small">不經上述澱粉分解路徑</text>

  <line x1="580" y1="472" x2="715" y2="472" class="arrow"/>
  <path d="M715 472l-12-8v16z" fill="#3E7CB1"/>
  <line x1="635" y1="447" x2="685" y2="497" class="bad"/>
  <line x1="685" y1="447" x2="635" y2="497" class="bad"/>
  <text x="790" y="480" text-anchor="middle" class="label" fill="#C94343">無效</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#64748B" fill-opacity="0.45" font-weight="600">本日有據</text></svg>