  <circle cx="754" cy="218" r="9" fill="#E8923A"/>
  <text x="790" y="224" class="label">蛋</text>

  <rect x="500" y="286" width="190" height="104" rx="16" fill="#EEF4FB"/>
  <rect x="526" y="309" width="42" height="43" rx="5" fill="#F4D58D" stroke="#3E7CB1" stroke-width="2"/>
  <line x1="526" y1="330" x2="568" y2="330" stroke="#3E7CB1" stroke-width="2"/>
  <text x="580" y="347" class="label">豆腐</text>

