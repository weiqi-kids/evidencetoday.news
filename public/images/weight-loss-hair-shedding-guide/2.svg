  <circle cx="270" cy="340" r="57" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="3"/>
  <circle cx="251" cy="330" r="9" fill="#8BBF8A"/>
  <circle cx="281" cy="321" r="8" fill="#E8923A"/>
  <circle cx="283" cy="353" r="10" fill="#3E7CB1"/>
  <circle cx="251" cy="359" r="7" fill="#F4D58D"/>

  <text x="510" y="143" font-size="19" font-weight="700" class="ink">蛋白質來源</text>

  <rect x="500" y="164" width="190" height="104" rx="16" fill="#EEF4FB"/>
  <path d="M526 216 Q546 196 568 216 Q546 237 526 216Z" fill="#3E7CB1"/>
