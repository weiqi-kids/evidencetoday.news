<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">均衡餐點，蛋白質多樣選</title>
  <desc id="desc">一盤均衡餐點旁並列呈現魚、蛋、豆腐、豆類、乳品與肉類。</desc>
  <style>
    text { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .ink { fill: #1E293B; }
    .muted { fill: #64748B; }
    .label { fill: #1A4F8B; font-size: 20px; font-weight: 700; }
  </style>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="56" y="70" font-size="34" font-weight="700" fill="#1A4F8B">均衡餐點，蛋白質多樣選</text>
  <text x="58" y="104" font-size="17" class="muted">不同來源，彈性輪替</text>

