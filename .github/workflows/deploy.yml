name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep the static Shorts page in sync with new public YouTube uploads.
    - cron: '15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_ID: UCTejYxFd04qma-LY0_Z17NQ
      YOUTUBE_MAX_VIDEOS: 500
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 🔴 sitemap 的靜態頁 lastmod 取該頁 .astro 的 git commit 日期
          #    （見 astro.config.mjs 的 pageGitDate）。淺 clone 只有一個 commit，
          #    每個檔案的 git log 都會回同一天＝每次部署宣稱全站更新，假訊號比沒有更糟。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check news source links
        run: pnpm check:news

      # 去 AI 味守門已併入 pnpm build（check-design && check-content && astro build，見 package.json），
      # 不再需要獨立 step。check-content 預設 grandfather（只掃相對 origin/main 的變動檔）：直推 main 時
      # CI 掃 0 檔，真正擋點在「提交前 pnpm build」（本地與 cron ops gate 都會跑）與 PR 的 content-audit.yml。
      - name: Myths quality gate
        run: pnpm check:myths

      - name: Build Astro
        # postbuild hook 已跑 pagefind --site dist（見 package.json），不需獨立 step 重跑索引。
        run: pnpm build

      - name: Remove local OG preview artifacts
        run: rm -rf dist/og-preview

      # 全站結構守門：只查「跨頁才看得出來」的事——各頁型的站內出口數、唯一 h1、
      # canonical/description/JSON-LD、sitemap 與 noindex 是否一致、站內死連結。
      # 排在 build 之後、連結檢查之前，因為它掃的是 dist/。
      # 由來：闢謠頁站內出口長期是 0，五道 src 層 gate 全部看不到（每個檔案都合法，
      # 「組起來沒有出口」不存在於任何單檔裡）。見 scripts/check-site.mjs 檔頭。
      - name: Site structure gate
        run: node scripts/check-site.mjs

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir dist --exclude "favicon\\.svg|favicon\\.ico|apple-touch-icon\\.png|og-preview/.*" dist/
          fail: true

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # upload.wikimedia.org 排除：成分縮圖 27 條熱連結已由 fix-ingredient-photo-urls.mjs
          # 逐條 HEAD 200 驗證；lychee 併發打它會被 429 + Retry-After 拖住，曾讓本步卡 30 分鐘以上
          args: --no-progress --exclude-path dist/fonts --exclude-path dist/og-preview --exclude "upload\.wikimedia\.org" dist/
          fail: false
        continue-on-error: true

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          staticDistDir: ./dist
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # 「這次 push 帶進來的內容」專用守門。
  #
  # 為什麼需要：build job 裡的 check:content / check:spec 比對的是 merge-base origin/main HEAD，
  # 直推 main 時那就是 HEAD 自己，掃 0 檔——設計上真正的擋點在「提交前的本機 pnpm build」。
  # 但有一條發文路徑完全不經本機：repo 外的工具透過 GitHub API 直接提交。對它而言 CI 是唯一的關卡，
  # 而那道關卡一直是空的。2026-09-21 回測過去 8 天：該路徑進來的 12 篇文章有 8 篇未達七月標準、
  # 22 處 AI 味 ERROR（含虛構的第一人稱臨床經驗），全部無聲進了 main。
  #
  # 為什麼獨立成 job 而不放進 build：放進 build 就會擋部署，而每小時的 schedule 觸發沒有
  # `before` 可比、會照常放行——等於「擋一小時後自己解除」，只製造延遲不製造約束。
  # 獨立 job 的效果是：部署照常，但這個 workflow 會亮紅燈並發 Slack 點名哪幾篇、違反哪幾條。
  # 真正的約束應該做在上游那支工具裡；要改成硬擋，把 deploy 的 needs 加上 content-gate 即可。
  content-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content gates on pushed files
        id: gates
        env:
          GATE_BASE_SHA: ${{ github.event.before }}
        run: |
          set +e
          node scripts/check-content.mjs 2>&1 | tee /tmp/gate-content.txt; c=${PIPESTATUS[0]}
          node scripts/check-spec.mjs    2>&1 | tee /tmp/gate-spec.txt;    s=${PIPESTATUS[0]}
          { grep -E '^\s+✗ ' /tmp/gate-content.txt /tmp/gate-spec.txt | sed -E 's#^/tmp/gate-[a-z]+\.txt:\s+##' | cut -c1-220 | head -12; } > /tmp/gate-summary.txt
          [ "$c" -eq 0 ] && [ "$s" -eq 0 ]

      - name: Notify Slack
        if: failure() && steps.gates.conclusion == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then echo "Slack secrets not set; skip."; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="$(printf '⚠️ 剛推上 main 的內容未過守門（commit %s）。部署沒有被擋、內容已上線，但請儘快修正：\n%s\n完整清單：%s' "${GITHUB_SHA::7}" "$(cat /tmp/gate-summary.txt)" "$RUN_URL")"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 部署後把「上線的 sitemap 全部 URL」送 IndexNow（Bing/Yandex/Seznam/Naver 即時收錄；
  # Bing→ChatGPT 搜尋接地）。Google 不吃 IndexNow，一路仍靠 sitemap + GSC。
  # 只在 push / 手動時跑（排除每小時 schedule 部署，避免對 IndexNow 洗版）。
  # 金鑰非機密（本就公開託管於 /<key>.txt）；腳本任何失敗都 exit 0，不擋部署。
  indexnow:
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://evidencetoday.news
      INDEXNOW_KEY: d53c801c406ed5f98e8db8f1ac17bbbe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Pages CDN propagation
        run: sleep 20

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow-submit.mjs

  # 任一階段 fail → 發 Slack 要求修改；修正 push 後 workflow 自動重跑＝重審。
  # 需 repo secrets：SLACK_BOT_TOKEN、SLACK_CHANNEL_ID（缺則靜默略過）。
  notify-failure:
    needs: [build, deploy, indexnow]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 ${{ github.repository }} 部署被守門擋下（commit ${GITHUB_SHA::7}）。請修正設計規範/建置錯誤後 push，workflow 會自動重審。詳情： $RUN_URL"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
